<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(420px); }
      }
      .ambient-glow-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 20% 30%;
      }
      .ambient-glow-2 {
        animation: pulseGlow 10s ease-in-out infinite 2s;
        transform-origin: 80% 40%;
      }
      .floating-pill {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-pill-alt {
        animation: floatSlow 7s ease-in-out infinite 1.5s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs -->
  <circle cx="240" cy="130" r="280" fill="url(#cyanGlow)" filter="url(#blurFilter)" class="ambient-glow-1" />
  <circle cx="980" cy="180" r="260" fill="url(#purpleGlow)" filter="url(#blurFilter)" class="ambient-glow-2" />
  <circle cx="600" cy="380" r="220" fill="url(#amberGlow)" filter="url(#blurFilter)" />

  <!-- Subtle Viewfinder Film Frame Guidelines -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <!-- Top-Left Corner -->
    <path d="M 40 70 L 40 40 L 70 40" />
    <!-- Top-Right Corner -->
    <path d="M 1160 70 L 1160 40 L 1130 40" />
    <!-- Bottom-Left Corner -->
    <path d="M 40 350 L 40 380 L 70 380" />
    <!-- Bottom-Right Corner -->
    <path d="M 1160 350 L 1160 380 L 1130 380" />
    <!-- Center Optical Crosshair -->
    <line x1="590" y1="210" x2="610" y2="210" stroke-opacity="0.2" />
    <line x1="600" y1="200" x2="600" y2="220" stroke-opacity="0.2" />
  </g>

  <!-- Cinema HUD Data Overlays -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1.5">
    <text x="80" y="55">REC ● 24.000 FPS</text>
    <text x="320" y="55">ACES 2065-1 / OCIO v2</text>
    <text x="880" y="55">RAW 16-BIT UNCOMPRESSED</text>
    <text x="1120" y="55" text-anchor="end">4K DCI • C2C ACTIVE</text>
  </g>

  <!-- Subtle Film Sprocket Strip on Sides -->
  <g fill="#1e293b" opacity="0.4">
    <rect x="15" y="40" width="12" height="18" rx="3" />
    <rect x="15" y="80" width="12" height="18" rx="3" />
    <rect x="15" y="120" width="12" height="18" rx="3" />
    <rect x="15" y="160" width="12" height="18" rx="3" />
    <rect x="15" y="200" width="12" height="18" rx="3" />
    <rect x="15" y="240" width="12" height="18" rx="3" />
    <rect x="15" y="280" width="12" height="18" rx="3" />
    <rect x="15" y="320" width="12" height="18" rx="3" />
    <rect x="15" y="360" width="12" height="18" rx="3" />

    <rect x="1173" y="40" width="12" height="18" rx="3" />
    <rect x="1173" y="80" width="12" height="18" rx="3" />
    <rect x="1173" y="120" width="12" height="18" rx="3" />
    <rect x="1173" y="160" width="12" height="18" rx="3" />
    <rect x="1173" y="200" width="12" height="18" rx="3" />
    <rect x="1173" y="240" width="12" height="18" rx="3" />
    <rect x="1173" y="280" width="12" height="18" rx="3" />
    <rect x="1173" y="320" width="12" height="18" rx="3" />
    <rect x="1173" y="360" width="12" height="18" rx="3" />
  </g>

  <!-- Foreground Title & Subtitle (Always Clear and Centered) -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <!-- Category Pill Tag -->
    <rect x="440" y="82" width="320" height="32" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="600" y="103" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1">🎬 OPEN CINEMATOGRAPHY &amp; FILM TECH</text>

    <!-- Main Title -->
    <text x="600" y="172" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">Film Production &amp; Open Cinematography</text>

    <!-- Subtitle -->
    <text x="600" y="215" font-size="18" font-weight="400" fill="#e2e8f0" opacity="0.95">The Curated Matrix of Industry SaaS Review Platforms &amp; Open-Source Post-Production Tools</text>

    <text x="600" y="242" font-size="14" font-weight="400" fill="#94a3b8">Camera-to-Cloud Dailies • OpenColorIO (OCIO) • OpenEXR • VFX Tracking • Open-Source NLEs • DIY Cinema Hardware</text>
  </g>

  <!-- Dynamic Feature Badges / Pills Below Subtitle -->
  <g class="floating-pill" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <!-- Pill 1: Camera-to-Cloud -->
    <g transform="translate(180, 285)">
      <rect x="-10" y="0" width="190" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#06b6d4" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="85" y="23" fill="#22d3ee">📡 Camera-to-Cloud</text>
    </g>

    <!-- Pill 2: OpenColorIO & ACES -->
    <g transform="translate(390, 285)">
      <rect x="-10" y="0" width="200" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="90" y="23" fill="#c084fc">🎨 OpenColorIO &amp; ACES</text>
    </g>

    <!-- Pill 3: Open-Source NLE & VFX -->
    <g transform="translate(610, 285)">
      <rect x="-10" y="0" width="195" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="88" y="23" fill="#60a5fa">🎞️ Open NLE &amp; VFX</text>
    </g>

    <!-- Pill 4: Open Cinema Hardware -->
    <g transform="translate(825, 285)">
      <rect x="-10" y="0" width="195" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="88" y="23" fill="#fbbf24">📽️ AXIOM &amp; CinePi Cinema</text>
    </g>
  </g>

  <!-- Metric / Tech Stat Bar -->
  <g class="floating-pill-alt" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    <text x="600" y="375">ASWF Standards • OCIO v2 • OpenTimelineIO • OpenRV • Frame.io C2C • Blender • Kdenlive • Shotcut • DaVinci Resolve</text>
  </g>
</svg>